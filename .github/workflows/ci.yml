
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff backend/
      - name: Tests
        run: pytest || echo "no tests yet"
