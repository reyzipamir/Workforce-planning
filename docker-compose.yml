
version: '3.9'
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wp
      POSTGRES_PASSWORD: wp
      POSTGRES_DB: wp
    ports:
      - "5432:5432"
